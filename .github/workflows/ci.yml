name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (PowerShell 7 + 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $all = Invoke-ScriptAnalyzer -Path . -Recurse
          $all | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 250 | Write-Host
          $errors = @($all | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { Write-Error "$($errors.Count) fel från PSScriptAnalyzer"; exit 1 }
      - name: Alla tester i PowerShell 7
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Statiska tester i Windows PowerShell 5.1
        shell: powershell
        run: ./tests/run-tests.ps1 -Quick

  linux:
    name: Linux (bash + PowerShell 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: shellcheck
        run: shellcheck -S warning hooks/*
      - name: Alla tester
        shell: pwsh
        run: ./tests/run-tests.ps1

  macos:
    name: macOS (bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax och röktest med /bin/bash 3.2
        run: |
          /bin/bash --version | head -1
          for h in hooks/*; do /bin/bash -n "$h"; done
          tmp="$(mktemp -d)"
          git init -q -b main "$tmp/r"
          cd "$tmp/r"
          git -c user.email=t@t -c user.name=t commit -q --allow-empty -m base
          run_hook() {
            printf 'refs/heads/main %s refs/heads/main 0000000000000000000000000000000000000000\n' "$(git rev-parse HEAD)" |
              GIT_GUARD_HOME="$GITHUB_WORKSPACE" /bin/bash "$GITHUB_WORKSPACE/hooks/pre-push" origin x | tee "$tmp/out.txt"
            grep -q 'Alla kontroller ok' "$tmp/out.txt"
          }
          echo '== inga ändrade filer'; run_hook
          echo hej > README.md
          git add README.md
          git -c user.email=t@t -c user.name=t commit -qm docs
          echo '== bara dokumentation'; run_hook
          git config gitguard.verbose true
          echo '== verbose'; run_hook
